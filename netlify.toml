# Netlify: Next.js via Netlify's adapter (detected automatically), pnpm from pnpm-lock.yaml.
# Environment variables are set in the Netlify UI/CLI — see README "Hosting on Netlify".

[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/turbopack/**"

# Production deploys apply pending migrations first (DIRECT_DATABASE_URL, the non-pooled URL).
# Deploy previews and branch deploys are not migrated: keep them off while they share the
# production database.
[context.production]
  command = "pnpm db:deploy && pnpm build"